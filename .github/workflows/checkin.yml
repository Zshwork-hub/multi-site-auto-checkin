name: Daily multi-site check-in

on:
  schedule:
    # GitHub Actions 使用 UTC；01:30 UTC = 北京时间 09:30。
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-check-in
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      COOKIE_MIHOYO: ${{ secrets.COOKIE_MIHOYO }}
      ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
      COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
      MIHOYO_ACT_ID: ${{ secrets.MIHOYO_ACT_ID }}
      MIHOYO_GAME_BIZ: ${{ secrets.MIHOYO_GAME_BIZ }}
      CHECKIN_MIN_DELAY: "2"
      CHECKIN_MAX_DELAY: "8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Run check-in
        run: python main.py

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
          retention-days: 7
