name: Daily multi-site check-in

on:
  schedule:
    # GitHub Actions 使用 UTC；01:30 UTC = 北京时间 09:30。
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-check-in
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      COOKIE_MIHOYO: ${{ secrets.COOKIE_MIHOYO }}
      AIVALUX_ACCESS_TOKEN: ${{ secrets.AIVALUX_ACCESS_TOKEN }}
      AIVALUX_REFRESH_TOKEN: ${{ secrets.AIVALUX_REFRESH_TOKEN }}
      AIVALUX_EMAIL: ${{ secrets.AIVALUX_EMAIL }}
      AIVALUX_PASSWORD: ${{ secrets.AIVALUX_PASSWORD }}
      AIVALUX_COOKIE: ${{ secrets.AIVALUX_COOKIE }}
      ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
      COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
      CHECKIN_MIN_DELAY: "2"
      CHECKIN_MAX_DELAY: "8"
      MIHOYO_MIN_DELAY: "1"
      MIHOYO_MAX_DELAY: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Run check-in
        run: python main.py

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: checkin-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
          retention-days: 7
